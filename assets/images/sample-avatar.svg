<svg xmlns="http://www.w3.org/2000/svg" class="avatar-svg" viewBox="0 0 220 236" role="img"
             aria-label="蓝喜阳的数字分身形象（玻璃拟态立体·带下肢）：鼠标移上去会挥手，点一下会跳一段「铁山靠」">
          <title>蓝色数字分身</title><style>.bump-fx{display:none}</style>
          <defs>
            <!-- 玻璃球主渐变：更透明，背景可透出 -->
            <radialGradient id="glassBody" cx="34%" cy="26%" r="84%">
              <stop offset="0%" stop-color="#EAF9FF" stop-opacity="0.72" />
              <stop offset="20%" stop-color="#BCEBFF" stop-opacity="0.52" />
              <stop offset="48%" stop-color="#74C8F6" stop-opacity="0.44" />
              <stop offset="78%" stop-color="#3FA5E8" stop-opacity="0.42" />
              <stop offset="100%" stop-color="#2C7FC4" stop-opacity="0.5" />
            </radialGradient>
            <!-- 内侧玻璃光晕（边缘透亮） -->
            <radialGradient id="glassSheen" cx="50%" cy="50%" r="50%">
              <stop offset="58%" stop-color="#ffffff" stop-opacity="0" />
              <stop offset="90%" stop-color="#ffffff" stop-opacity="0.28" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
            </radialGradient>
            <!-- 玻璃边框渐变（白高光到浅蓝） -->
            <linearGradient id="glassRim" x1="0" y1="0" x2="0.3" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
              <stop offset="55%" stop-color="#ffffff" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#A6E1FF" stop-opacity="0.6" />
            </linearGradient>
            <!-- 底部折射光弧 -->
            <linearGradient id="glassRefract" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
              <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
            <!-- 下肢（腿/脚）玻璃渐变 -->
            <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#A6E1FF" stop-opacity="0.6" />
              <stop offset="100%" stop-color="#3BA3E6" stop-opacity="0.5" />
            </linearGradient>
            <filter id="glassBlur" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="6" />
            </filter>
            <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3" />
            </filter>
            <filter id="glowOnly" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="7" />
            </filter>
            <clipPath id="ballClip">
              <circle cx="110" cy="88" r="74" />
            </clipPath>
          </defs>

          <!-- 落地投影：营造立体悬浮感 -->
          <ellipse cx="110" cy="229" rx="58" ry="7" fill="#3C9BD6" opacity="0.26"
                   filter="url(#glassBlur)" />

          <!-- ==== 「铁山靠」身体分组：以双脚为轴整体侧倾 / 前顶（落地投影保持不动） ==== -->
          <g class="avatar-body">
          <!-- 下肢：两条玻璃质感小腿 + 脚 -->
          <rect x="84" y="132" width="17" height="88" rx="8.5" fill="url(#legGrad)" />
          <rect x="119" y="132" width="17" height="88" rx="8.5" fill="url(#legGrad)" />
          <rect x="87" y="138" width="4" height="72" rx="2" fill="#ffffff" opacity="0.5" />
          <rect x="122" y="138" width="4" height="72" rx="2" fill="#ffffff" opacity="0.5" />
          <ellipse cx="92.5" cy="218" rx="15" ry="9" fill="url(#legGrad)" />
          <ellipse cx="127.5" cy="218" rx="15" ry="9" fill="url(#legGrad)" />
          <ellipse cx="92.5" cy="216" rx="9" ry="4" fill="#ffffff" opacity="0.4" />
          <ellipse cx="127.5" cy="216" rx="9" ry="4" fill="#ffffff" opacity="0.4" />

          <!-- 外发光：科技感光环 -->
          <circle cx="110" cy="88" r="76" fill="#5BC8FF" opacity="0.3"
                  filter="url(#glowOnly)" />

          <!-- 玻璃球主体 -->
          <circle cx="110" cy="88" r="74" fill="url(#glassBody)" />

          <!-- 球内全息纬线（科技感，裁剪在球内） -->
          <g clip-path="url(#ballClip)" stroke="#AEE6FF" fill="none" opacity="0.55">
            <ellipse cx="110" cy="88" rx="74" ry="24" stroke-width="1" />
            <ellipse cx="110" cy="88" rx="74" ry="48" stroke-width="1" />
            <ellipse cx="110" cy="88" rx="24" ry="74" stroke-width="1" />
            <ellipse cx="110" cy="88" rx="48" ry="74" stroke-width="1" />
          </g>

          <!-- 内侧玻璃光晕 -->
          <circle cx="110" cy="88" r="74" fill="url(#glassSheen)" />

          <!-- 左上大高光：玻璃反光 -->
          <ellipse cx="80" cy="44" rx="33" ry="21" fill="#ffffff" opacity="0.68"
                   transform="rotate(-28 80 44)" filter="url(#softBlur)" />
          <circle cx="68" cy="36" r="9.5" fill="#ffffff" opacity="0.9" />
          <circle cx="94" cy="29" r="4.5" fill="#ffffff" opacity="0.78" />

          <!-- 天蓝色内发光描边：科技感 -->
          <circle cx="110" cy="88" r="74" fill="none" stroke="#7FDBFF" stroke-width="1.4"
                  opacity="0.62" />

          <!-- 底部折射光弧 -->
          <path d="M46 112 A74 74 0 0 0 174 112" fill="none" stroke="url(#glassRefract)"
                stroke-width="3" stroke-linecap="round" opacity="0.85" />

          <!-- 玻璃边缘描边 -->
          <circle cx="110" cy="88" r="74" fill="none" stroke="url(#glassRim)" stroke-width="2.2" />

          <!-- 眼睛：大而萌 -->
          <ellipse cx="84" cy="82" rx="15" ry="17" fill="#ffffff" opacity="0.95" />
          <ellipse cx="136" cy="82" rx="15" ry="17" fill="#ffffff" opacity="0.95" />
          <circle cx="88" cy="84" r="8" fill="#20405C" />
          <circle cx="140" cy="84" r="8" fill="#20405C" />
          <circle cx="92" cy="80" r="3" fill="#ffffff" />
          <circle cx="144" cy="80" r="3" fill="#ffffff" />

          <!-- 微笑 -->
          <path d="M96 114 Q110 125 124 114" fill="none" stroke="#20405C" stroke-width="4"
                stroke-linecap="round" />

          <!-- 腮红 -->
          <ellipse cx="66" cy="106" rx="9" ry="6" fill="#FFB3C7" opacity="0.5" />
          <ellipse cx="154" cy="106" rx="9" ry="6" fill="#FFB3C7" opacity="0.5" />

          <!-- 手臂：左臂自然下垂，右臂可挥手（玻璃质感，纯手绘 SVG 原创） -->
          <!-- 左臂（静止） -->
          <g class="arm arm-left">
            <line x1="68" y1="122" x2="56" y2="160" stroke="url(#legGrad)" stroke-width="15"
                  stroke-linecap="round" />
            <line x1="65" y1="126" x2="57" y2="152" stroke="#ffffff" stroke-width="3"
                  stroke-linecap="round" opacity="0.45" />
            <circle cx="54" cy="163" r="10" fill="url(#legGrad)" />
            <circle cx="51" cy="160" r="3.5" fill="#ffffff" opacity="0.55" />
          </g>

          <!-- 右臂（鼠标悬停 / 点按 → 挥手） -->
          <g class="arm arm-right arm-wave">
            <line x1="152" y1="122" x2="164" y2="160" stroke="url(#legGrad)" stroke-width="15"
                  stroke-linecap="round" />
            <line x1="155" y1="126" x2="163" y2="152" stroke="#ffffff" stroke-width="3"
                  stroke-linecap="round" opacity="0.45" />
            <circle cx="166" cy="163" r="10" fill="url(#legGrad)" />
            <circle cx="163" cy="160" r="3.5" fill="#ffffff" opacity="0.55" />
          </g>
          </g><!-- /avatar-body -->

          <!-- ==== 铁山靠 · 冲击特效：左肩扩散光环 + 速度线（仅舞蹈时浮现） ==== -->
          <g class="bump-fx" aria-hidden="true">
            <circle class="bump-ring" cx="40" cy="116" r="14" fill="none" stroke="#7FDBFF" stroke-width="2.2" />
            <circle class="bump-ring bump-ring-2" cx="40" cy="116" r="14" fill="none" stroke="#A5F3FC" stroke-width="1.6" />
            <line class="bump-line" x1="28" y1="96" x2="6" y2="88" stroke="#7FDBFF" stroke-width="2.6" stroke-linecap="round" />
            <line class="bump-line bump-line-2" x1="26" y1="116" x2="6" y2="116" stroke="#A5F3FC" stroke-width="2.6" stroke-linecap="round" />
            <line class="bump-line bump-line-3" x1="28" y1="136" x2="6" y2="144" stroke="#7FDBFF" stroke-width="2.6" stroke-linecap="round" />
          </g>
        </svg>